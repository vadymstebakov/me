version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: github-actions
      directories: ['/', '/.github/actions/setup']
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns: ['*']
